name: NeverUp2Late
# Filled in from the pom during the build - do not edit by hand, otherwise the
# jar name of a release and the version the plugin reports about itself drift
# apart and self-updating compares the wrong numbers.
version: '${project.version}'
main: eu.nurkert.neverUp2Late.NeverUp2Late
author: nurkert
api-version: '1.21'
commands:
  nu2l:
    description: Manage NeverUp2Late - status, updates, plugins and installs.
    usage: "/<command> help"
    # Deliberately no command-level permission: Bukkit would enforce it before
    # the command ever runs, so everyone without neverup2late.install would be
    # refused - including moderators who only hold neverup2late.gui.open. Each
    # subcommand checks its own permission instead.
permissions:
  neverup2late.setup:
    description: Allows completing the initial setup wizard.
    default: op
  neverup2late.install:
    description: Allows using the /nu2l command to install new update sources.
    default: op
  neverup2late.gui.open:
    description: Allows opening the graphical interface.
    default: op
  neverup2late.gui.manage:
    description: Grants all management permissions in the GUI.
    default: op
    children:
      neverup2late.gui.manage.lifecycle: true
      neverup2late.gui.manage.link: true
      neverup2late.gui.manage.settings: true
      neverup2late.gui.manage.rename: true
      neverup2late.gui.manage.remove: true
  neverup2late.gui.manage.lifecycle:
    description: Allows loading, unloading, and enabling plugins through the GUI.
    default: op
  neverup2late.gui.manage.link:
    description: Allows linking plugins with update sources.
    default: op
  neverup2late.gui.manage.settings:
    description: Allows adjusting update settings in the GUI.
    default: op
  neverup2late.gui.manage.rename:
    description: Allows renaming plugin files through the GUI.
    default: op
  neverup2late.gui.manage.remove:
    description: Allows removing plugins through the GUI.
    default: op
