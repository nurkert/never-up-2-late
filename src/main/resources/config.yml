# Control the behaviour of the first-run setup wizard
setup:
  # When true, NeverUp2Late skips the interactive wizard and applies the default
  # update sources immediately during server start.
  skipWizard: false

# The names of the jars as they are in the server directory
filenames:
  geyser: "Geyser-Spigot.jar"
  floodgate: "floodgate-spigot.jar"
  paper: "paper.jar"
  neverup2late: "NeverUp2Late.jar"

# Check interval in minutes
updateInterval: 180

# Seconds to wait after the server started before the first check runs. This
# keeps the download and the file work out of the boot phase, while worlds are
# loading and the other plugins are still enabling. Set to 0 to check right away.
startupDelaySeconds: 60

# Controls automatic plugin lifecycle operations (reload/unload).
pluginLifecycle:
  # When true, NeverUp2Late will attempt to reload updated plugins automatically.
  # The default is now true so the GUI is usable without manual configuration.
  autoManage: true

# Control compatibility checks when linking update sources via /nu2l or the GUI.
quickInstall:
  # When true, NeverUp2Late ignores compatibility warnings reported by metadata providers
  # (for example when a Modrinth project targets a newer Minecraft version).
  ignoreCompatibilityWarnings: false

# Configure how many backups NeverUp2Late keeps per update source before pruning
# the oldest entries. Set to 0 to keep all backups.
backups:
  maxCount: 5

# Ignore unstable builds (legacy location, still respected if updates.ignoreUnstable is absent)
ignoreUnstable: true

updates:
  # Prefer stable builds. Fetchers that can tell releases from pre-releases use
  # this as a preference, not as a hard rule: if a project only ever publishes
  # beta versions, it still gets updated instead of quietly freezing. Set a
  # source's own "versionTypes" option if you want an exact filter.
  ignoreUnstable: true

  # Leave a manual rollback alone. After you restored an older build, the
  # updater will not push the version you rolled back from onto the server
  # again - it waits for a genuinely newer one. Set this to false if an update
  # should always be re-applied instead.
  respectManualRollback: true

  # Configure the update sources that should be checked.
  # - name: identifier used for persistence and filename lookups
  # - type: either a simple alias (e.g. "paper") or the fully qualified UpdateFetcher class name
  # - target: "server" to place the jar next to the server executable or "plugins" for the plugins directory
  # - filename: optional override for the downloaded jar name (defaults to entries under filenames.<name>)
  sources:
    - name: paper
      type: paper
      target: server
      filename: "paper.jar"
      enabled: true
      options:
        # NeverUp2Late never leaves the Minecraft version the server currently
        # runs. Paper publishes builds for the next major version long before
        # most servers are ready for it, and installing one would restart the
        # server into a version its worlds and plugins were not prepared for.
        # Set this to true only when you want that jump to happen automatically.
        allowGameVersionUpgrade: false

    # Geyser lets Bedrock clients join. It ships disabled: NeverUp2Late installs
    # what you ask it to, and an entry that is enabled here would be downloaded
    # on the first run whether or not you wanted it. Flip this to true (or pick
    # it in the setup wizard) if you use Geyser.
    - name: geyser
      type: geyser
      target: plugins
      filename: "Geyser-Spigot.jar"
      enabled: false

    # NeverUp2Late keeps itself up to date from its GitHub releases. Set
    # enabled: false if you would rather update it by hand.
    #
    # It cannot reload itself into a running server - that would close the class
    # loader it is executing in - so a new version is applied by a restart. Like
    # every plugin update, that restart waits for an empty server and for the
    # 03:00-06:00 maintenance window. In other words: with this enabled, your
    # server may restart at night to install a new NeverUp2Late. Anyone online
    # is told before it happens, and nothing restarts while players are on.
    - name: neverup2late
      type: githubRelease
      target: plugins
      filename: "NeverUp2Late.jar"
      enabled: true
      options:
        owner: nurkert
        repository: never-up-2-late
        # The release ships a stable, version-less jar name next to the
        # versioned one; picking it keeps the file name constant.
        assetPattern: "^NeverUp2Late\\.jar$"
        installedPlugin: "NeverUp2Late"

    # The example below illustrates how to configure a GitHub release source.
    # Uncomment and adjust the values to track a real project.
    # - name: examplePlugin
    #   type: githubRelease
    #   target: plugins
    #   filename: "ExamplePlugin.jar"
    #   options:
    #     owner: example
    #     repository: example-plugin
    #     # assetPattern: ".*paper.*\\.jar$"   # optional regex to select a specific asset
    #     # allowPrerelease: false              # optional, defaults to false
    #     # installedPlugin: "ExamplePlugin"   # optional, used to read the installed version

    # The example below illustrates how to configure a SpigotMC resource via the Spiget API.
    # - name: exampleSpigot
    #   type: spigot
    #   target: plugins
    #   filename: "ExamplePlugin.jar"
    #   options:
    #     resourceId: 123456              # required numeric ID from the SpigotMC URL
    #     # preferredGameVersions:
    #     #   - "1.21"
    #     # ignoreCompatibilityWarnings: false
    #     # installedPlugin: "ExamplePlugin"
